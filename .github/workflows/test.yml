name: test

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  logic:
    name: 計算ロジックの自動テスト
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # 依存パッケージ不要（index.html から計算ロジックを抜き出して実行する）
      - run: node tools/run-tests.js

  ui:
    name: UI 通し操作テスト
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run test:ui

  browser:
    name: 実ブラウザ（Chromium）操作テスト
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: スクリーンショットを保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-screenshots
          path: test-artifacts/
          if-no-files-found: ignore
